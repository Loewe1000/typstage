name: Decks im Browser durchfahren

# Nicht in `pages.yml`. Der baut und deployt; ein Prüflauf, der einen Deploy
# aufhält, wird beim ersten Fehlalarm umgangen, und danach prüft er nichts
# mehr. Er gehört vor eine Freigabe, also an den Pull Request.
#
# Auch keine schnelle Fassung bei jedem Push. Gemessen auf einem Mac mini:
# der volle Lauf braucht mit neun Decks 283 s, derselbe Lauf mit
# zwanzigfachem Animationstempo 86 s, und beide liefern einen byteidentischen
# Bericht. Die
# Ersparnis sind knapp drei Minuten, der Rest ist Seitenladen und
# Browserstart, nicht Warten auf Animationen. Dafür einen zweiten Lauf zu
# pflegen, der dieselben Zahlen ausspricht, lohnt nicht; vier Minuten vor
# einer Freigabe sind kein Latenzproblem.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decks:
    name: Siebzehn Beispiele und das Prüfdeck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Typst-Schule danebenlegen
        uses: actions/checkout@v4
        with:
          repository: Loewe1000/Typst-Schule
          path: .aggregat
          fetch-depth: 1

      # node 22, wegen des globalen `WebSocket`, das der CDP-Treiber benutzt.
      # Das Standard-node des Läufers ist älter, und der Lauf sagt dann zwar
      # klar, was fehlt, prüft aber nichts.
      - name: node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Typst installieren
        uses: typst-community/setup-typst@v4
        with:
          # 0.15.1, nicht 0.15.0 wie in pages.yml. Der Sollstand enthält mit
          # `satz` einen SHA der gesetzten Ausgabe, und der hängt am
          # Übersetzer -- ein anderer Punktstand ergäbe eine Abweichung, die
          # niemand verursacht hat. pages.yml darf auf 0.15.0 bleiben, es
          # vergleicht nichts, sondern baut nur.
          typst-version: "0.15.1"

      # Der Lauf misst, was ausgeliefert wird, und nicht, was gerade in der
      # Quelle steht: ein Deck trägt seine Laufzeit wörtlich in sich. Deshalb
      # erst bauen. Weicht die eingebaute Laufzeit von `assets/` ab, sagt der
      # Lauf das eigens.
      - name: Seite bauen
        env:
          AGGREGAT: ${{ github.workspace }}/.aggregat
        run: bash .github/scripts/build-site.sh

      # Kein npm, kein Playwright. Chrome liegt auf dem Läufer, und node
      # bringt `fetch` und `WebSocket` selbst mit; mehr braucht
      # `.github/scripts/decklauf/cdp.js` nicht.
      - name: Decks durchfahren
        run: node .github/scripts/pruefe-decks.js --bericht bericht.json

      # Zwei echte Fenster. Der Lauf darüber prüft alles, was ein Fenster für
      # sich tut; drei Fehler der Fernsteuerung sind genau durch diese Lücke
      # gekommen, weil sie erst zwischen zwei Fenstern sichtbar werden.
      - name: Die Fernsteuerung mit zwei Fenstern
        run: node .github/scripts/decklauf/zwei-fenster.js

      # Was während einer Bewegung übereinander liegt. Der Lauf darüber misst
      # Decks im Ruhezustand -- er wartet nach jedem Schritt, bis nichts mehr
      # läuft. Die Höhe eines fliegenden Elements sieht er nie.
      - name: Was während eines Fluges übereinander liegt
        run: node .github/scripts/decklauf/flug-hoehe.js

      # Und was ein Sprung hinterlässt, der mitten in eine laufende Bewegung
      # fällt. `finishTransitionNow()` hing einmal allein an `fly()`, und `fly`
      # läuft bei einem `instant` nicht: die alte Animation lief mit
      # `fill: "both"` weiter, über die Folie hinweg, auf die gesprungen wurde.
      - name: Ein Sprung mitten in einem Übergang
        run: node .github/scripts/decklauf/sprung.js

      # Ob der Rundgang sein eigenes Versprechen noch hält. Ohne Browser und in
      # einer Sekunde: `tour.typ` sagt im Untertitel „every function once", und
      # als das zum ersten Mal nachgezählt wurde, waren es 34 von 57.
      - name: Der Rundgang zeigt jede Ausfuhr
        run: python3 .github/scripts/pruefe-rundgang.py

      # Das Kontrastgatter der Sprecherpalette. Ohne Browser und in einer
      # Sekunde: `contrast()` im Paket bewacht die Folienpaletten, die zwanzig
      # Farben der Sprecheransicht standen unter keiner Aufsicht.
      - name: Die Farben der Sprecheransicht
        run: python3 .github/scripts/pruefe-palette.py

      # Und was die Ansicht im Browser wirklich tut: nichts ragt hinaus, die
      # vier Zahlen stehen auf einer Grundlinie, die Regeln greifen, Auswahl
      # und Fokus sind zu sehen. Beides in hell und dunkel.
      - name: Die Sprecheransicht in beiden Erscheinungsbildern
        run: node .github/scripts/decklauf/pult.js

      - name: Bericht aufheben
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deckbericht
          path: bericht.json
          if-no-files-found: ignore
