name: Decks im Browser durchfahren

# Nicht in `pages.yml`. Der baut und deployt; ein Prüflauf, der einen Deploy
# aufhält, wird beim ersten Fehlalarm umgangen, und danach prüft er nichts
# mehr. Er gehört vor eine Freigabe, also an den Pull Request.
#
# Auch keine schnelle Fassung bei jedem Push. Gemessen auf einem Mac mini:
# der volle Lauf braucht mit neun Decks 283 s, derselbe Lauf mit
# zwanzigfachem Animationstempo 86 s, und beide liefern einen byteidentischen
# Bericht. Die
# Ersparnis sind knapp drei Minuten, der Rest ist Seitenladen und
# Browserstart, nicht Warten auf Animationen. Dafür einen zweiten Lauf zu
# pflegen, der dieselben Zahlen ausspricht, lohnt nicht; vier Minuten vor
# einer Freigabe sind kein Latenzproblem.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decks:
    name: Neunzehn Beispiele und das Prüfdeck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Typst-Schule danebenlegen
        uses: actions/checkout@v4
        with:
          repository: Loewe1000/Typst-Schule
          path: .aggregat
          fetch-depth: 1

      # node 22, wegen des globalen `WebSocket`, das der CDP-Treiber benutzt.
      # Das Standard-node des Läufers ist älter, und der Lauf sagt dann zwar
      # klar, was fehlt, prüft aber nichts.
      - name: node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Typst installieren
        uses: typst-community/setup-typst@v4
        with:
          # 0.15.1, nicht 0.15.0 wie in pages.yml. Der Sollstand enthält mit
          # `satz` einen SHA der gesetzten Ausgabe, und der hängt am
          # Übersetzer -- ein anderer Punktstand ergäbe eine Abweichung, die
          # niemand verursacht hat. pages.yml darf auf 0.15.0 bleiben, es
          # vergleicht nichts, sondern baut nur.
          typst-version: "0.15.1"

      # Der Lauf misst, was ausgeliefert wird, und nicht, was gerade in der
      # Quelle steht: ein Deck trägt seine Laufzeit wörtlich in sich. Deshalb
      # erst bauen. Weicht die eingebaute Laufzeit von `assets/` ab, sagt der
      # Lauf das eigens.
      - name: Seite bauen
        env:
          AGGREGAT: ${{ github.workspace }}/.aggregat
        run: bash .github/scripts/build-site.sh

      # Kein npm, kein Playwright. Chrome liegt auf dem Läufer, und node
      # bringt `fetch` und `WebSocket` selbst mit; mehr braucht
      # `.github/scripts/decklauf/cdp.js` nicht.
      - name: Decks durchfahren
        run: node .github/scripts/pruefe-decks.js --bericht bericht.json

      # Zwei echte Fenster. Der Lauf darüber prüft alles, was ein Fenster für
      # sich tut; drei Fehler der Fernsteuerung sind genau durch diese Lücke
      # gekommen, weil sie erst zwischen zwei Fenstern sichtbar werden.
      - name: Die Fernsteuerung mit zwei Fenstern
        run: node .github/scripts/decklauf/zwei-fenster.js

      # Was während einer Bewegung übereinander liegt. Der Lauf darüber misst
      # Decks im Ruhezustand -- er wartet nach jedem Schritt, bis nichts mehr
      # läuft. Die Höhe eines fliegenden Elements sieht er nie.
      - name: Was während eines Fluges übereinander liegt
        run: node .github/scripts/decklauf/flug-hoehe.js

      # Und was ein Sprung hinterlässt, der mitten in eine laufende Bewegung
      # fällt. `finishTransitionNow()` hing einmal allein an `fly()`, und `fly`
      # läuft bei einem `instant` nicht: die alte Animation lief mit
      # `fill: "both"` weiter, über die Folie hinweg, auf die gesprungen wurde.
      - name: Ein Sprung mitten in einem Übergang
        run: node .github/scripts/decklauf/sprung.js

      # Ob der Rundgang sein eigenes Versprechen noch hält. Ohne Browser und in
      # einer Sekunde: `tour.typ` sagt im Untertitel „every function once", und
      # als das zum ersten Mal nachgezählt wurde, waren es 34 von 57. Dazu die
      # Schlüssel ohne eigene Ausfuhr -- `room` und seine Einträge,
      # `section-back`, `ends-at` --, jeder dort, wo er wirkt.
      - name: Der Rundgang zeigt jede Ausfuhr und jeden neuen Schlüssel
        run: python3 .github/scripts/pruefe-rundgang.py

      # Ragt in einem Beispieldeck etwas aus seiner Folie? Der Melder des
      # Pakets steht per Vorgabe auf `overflow: "none"`, weil er den Bau
      # verteuert -- angeschaltet hatte ihn genau ein Deck. Über die anderen
      # sechzehn lief er nie, und der Decklauf prüft nur, *dass* der Melder
      # meldet, nicht die Decks. Beim ersten Anlauf dieser Probe kamen drei
      # Folien des Rundgangs zum Vorschein, die niemand gesehen hatte, weil
      # der Browser wegschneidet, was übersteht.
      - name: Kein Deck ragt aus seiner Folie
        run: python3 .github/scripts/pruefe-ueberlauf.py

      # Reicht `bleed` bis an die Kante, und fehlt dort das Chrome? Hat eine
      # Folie ohne Titel keine Laufzeile mehr? Das Standardthema zeigte auf
      # einer titellosen Folie auch vorher keine; die Probe nimmt deshalb
      # `themes.lesson` mit Bruchzahl und Leiste. Farben statt Glyphen: jedes
      # Stück Chrome trägt über sein Label eine eigene.
      - name: bleed und Folien ohne Titel auf Papier
        run: python3 .github/scripts/pruefe-vollbild.py

      # Dasselbe Deck im Browser: sitzen die Sprites im Bild auf der Leinwand,
      # fliegen die Morphs hinein und hinaus, geht die Leiste und kommt sie
      # wieder, und trägt die Druckansicht kein Chrome?
      - name: bleed im Browser
        run: node .github/scripts/pruefe-vollbild.js

      # Steht die Zier im Browser, wo sie im PDF steht? Gemeldet in Issue #16:
      # im PDF „6/34", im Browser „6/3", die letzte Ziffer unter dem Rand der
      # Bühne. Im Browser ist die Zier eine eigene Ebene über der Bühne und
      # bekam nicht mit, was ihr auf Papier die Seite gibt -- die Schriftgröße,
      # gegen die ein Rand in `em` zählt --, und eine `set`-Regel des Decks
      # erreichte sie nur auf einer Seite. Dreizehn kleine Decks, jedes als
      # Seite aus Typst und als Bildschirmfoto aus Chrome, Tinte gegen Tinte.
      - name: Die Zier steht im Browser wie im PDF
        run: node .github/scripts/pruefe-zier.js

      # Eine halbe Sekunde Aufdeckung, eine Sekunde Flug, eine knappe halbe
      # Folienwechsel: Wer zügig vorführt, blättert mitten hinein. Drei Decks,
      # Bild für Bild gemessen -- springt das Bild, oder läuft es weiter?
      - name: Bewegungen lassen sich unterbrechen und umkehren
        run: node .github/scripts/pruefe-unterbrechen.js

      # Eine Rechnung, die über die Folie hinausläuft, und ein `place` neben
      # ihr: Wächst das Blatt mit dem Inhalt, folgt die Ansicht dem
      # aufgedeckten Schritt, bleibt der Kopf stehen -- und kommt auf Papier
      # alles auf die Seite?
      - name: Die Folie wächst mit ihrem Inhalt
        run: node .github/scripts/pruefe-leinwand.js

      # Ein `pin` ist die ausdrückliche Ansage, dass zwei Stücke dasselbe sind.
      # Vier Decks: fasst er alle seine Zeichen, reisen sie gemeinsam, reist er
      # auch über der Glyphengrenze, und kommt die eigene Grenze an?
      - name: Ein Name reist, als Gruppe und über der Grenze
        run: node .github/scripts/pruefe-morph-pin.js

      # Springt das Inhaltsverzeichnis wirklich? Typst schreibt interne Ziele
      # als erzeugte DOM-Namen, und ob der Klick auf dem richtigen Schritt
      # landet, sagt nur der Browser. Der Rückweg ist der Teil, an dem eine
      # Prüfung von Hand scheitert: steht man schon auf der Inhaltsfolie,
      # bewegt sich nichts, und der Verweis sieht kaputt aus, obwohl er stimmt.
      - name: Das Inhaltsverzeichnis springt hin und zurück
        run: node .github/scripts/pruefe-inhalt.js

      # Nimmt eine cue-Gruppe den Vorwärtspfeil erst, wenn sie an der Reihe
      # ist? Sichtbar wird das nur, wenn vor der Gruppe noch gewöhnliche
      # Schritte stehen. Solange jede Probe ihre Gruppe auf Schritt 1 beginnen
      # ließ, war ein zu früher Zugriff von richtigem Verhalten nicht zu
      # unterscheiden -- gemeldet wurde er aus einem echten Deck, in dem ein
      # Pfeil von Schritt 1 auf 4 sprang und zwei Halte verschluckte.
      - name: Eine cue-Gruppe greift erst, wenn sie dran ist
        run: node .github/scripts/pruefe-cue-pfeil.js

      # Eine Fußnote in einer Aufdeckkette: erscheint ihre Anmerkung mit ihrer
      # Marke und nicht vorher? Sichtbar ist das nur im Browser -- im Satz
      # steht die Anmerkung als Glyphenpfad, und ob sie zu sehen ist, sagt
      # allein die Deckkraft ihres Elements.
      - name: Eine Anmerkung erscheint mit ihrer Marke
        run: node .github/scripts/pruefe-fussnoten.js

      # Der Griff zwischen Folie und Notiz am Pult. Die Aufteilung entsteht
      # erst im Gitter, und ob die Bühne nach dem Ziehen noch in ihre Kachel
      # passt, sagt keine Datei. Die Probe fährt beide Richtungen, die
      # Tastatur, den Doppelklick und beide Anschläge -- eine Prüfung, die nur
      # eine Richtung kennt, haelt auch die verkehrte für richtig, und genau
      # das ist hier einmal passiert.
      - name: Die Folie lässt sich am Pult kleiner ziehen
        run: node .github/scripts/pruefe-pult-teiler.js

      # Die Zifferntasten stellen die Klassenuhr -- außer auf einer Folie mit
      # cue()-Gruppe, der die Ziffern gehören. Entschieden wird das am Zustand
      # der Folie und nicht daran, ob `adTaste` etwas getan hat: drei seiner
      # vier Absagen liegen mitten auf einer cue-Folie. Dazu das Raster, das
      # die Anzeige ruhig stellt, und die letzte Stufe, die trotzdem einzeln
      # zählt. Ohne Browser ist davon nichts zu sehen: die Uhr zählt in
      # Bühnenzeit, und wie sie liest, entsteht erst im DOM.
      - name: Die Ziffern stellen die Klassenuhr
        run: node .github/scripts/pruefe-uhr-ziffern.js

      # Der Zeiger zeigt -- auf jeder Folie und nicht nur auf denen mit einem
      # eingebetteten Rahmen. Geprüft wird mit zwei echten Fenstern: der Punkt
      # reist über `postMessage`, und mit einem Fenster sähe keine Probe, ob er
      # drüben ankommt. Die Bühnen sind dabei verschieden groß, denn der Punkt
      # steht in Bruchteilen der Bühne und darf sich von Pixeln nicht beirren
      # lassen. Dazu die ältere Fähigkeit desselben Modus: ein Klick geht
      # weiterhin in den Rahmen, ein bloßes Schweben nicht.
      - name: Der Zeiger setzt einen Punkt im Saal
        run: node .github/scripts/pruefe-zeiger.js

      # Und dasselbe in Firefox, Punkt für Punkt dasselbe. Gemeldet war der
      # Zeiger in Chrome UND Firefox, und `pruefe-zeiger.js` hängt an
      # `decklauf/cdp.js`: Firefox ab 129 antwortet auf
      # `--remote-debugging-port` nur noch mit WebDriver BiDi. Also eine zweite
      # Probe über `decklauf/bidi.js`. Beide Proben tragen dieselben Punkte 1
      # bis 17, dazu Punkt 0 für ein Probedeck, das nicht taugt, und nehmen
      # ihre Decks aus `decklauf/zeigerdeck.js`; den Fokusverlust misst die
      # Firefox-Probe sogar echt, weil BiDi ein Fenster nach vorn holen kann.
      #
      # Dies ist der erste Schritt dieses Laufs, der auf dem Läufer einen
      # Firefox braucht -- `pruefe-decks.js` fährt immer genau EINEN Browser
      # und nimmt Chrome zuerst. Deshalb dieselbe Wache wie bei ffmpeg, qpdf
      # und poppler-utils weiter unten. Gemessen, warum sie hier sein muss:
      # ohne einen Firefox auf einem ihrer fünf Pfade bricht die Probe mit
      # rc=2 und der Meldung „kein Firefox gefunden -- mit --browser einen Pfad
      # angeben. Geprüft wurde damit nichts." ab. Sie meldet also nie still
      # grün; der Schritt würde rot, und niemand wüsste, dass nicht das Paket
      # kaputt ist, sondern der Läufer leer. Auf einem GitHub-Läufer ist das
      # hier nicht erprobt -- gemessen ist der Abbruch, nicht der `apt-get`.
      - name: Der Zeiger setzt einen Punkt im Saal -- auch in Firefox
        run: |
          firefox --version >/dev/null 2>&1 || sudo apt-get install -y firefox
          node .github/scripts/pruefe-zeiger-ff.js

      # Eine Taste, ein Klang, und zwar im Saal. Ob der Ton im richtigen
      # Fenster landet, sagt keine Datei; und dass der Befehl über eine eigene
      # Nachrichtenart fährt und nicht im Zustandskanal, sieht nur ein Lauf
      # mit zwei Fenstern -- im Zustandskanal gongte es bei jedem
      # Wiederanmelden.
      - name: Eine Taste spielt einen Klang im Saal
        run: node .github/scripts/pruefe-klang.js

      # Ein Video, das zur Glocke endet. Die Probe braucht ein Video von
      # bekannter Länge und baut es sich mit ffmpeg; die Wanduhr wird dabei
      # festgenagelt, sonst hinge jede Messung daran, wie spät es beim Lauf
      # gerade ist.
      - name: Ein Video endet zur vollen Minute
        run: |
          ffmpeg -version >/dev/null 2>&1 || sudo apt-get install -y ffmpeg
          node .github/scripts/pruefe-video-frist.js

      # Trägt das PDF ein Lesezeichenverzeichnis? Ein Foliensatz ohne ist im
      # Reader ein Stapel ohne Griff. Gelesen wird die Datei selbst, über
      # qpdf -- Lesezeichen sind eine Eigenschaft des PDF und keine der
      # Anzeige, und ein Browser sieht davon nichts.
      - name: Das PDF trägt Lesezeichen
        run: |
          qpdf --version >/dev/null 2>&1 || sudo apt-get install -y qpdf
          python3 .github/scripts/pruefe-lesezeichen.py

      # Tragen alle drei Sprachen dieselben Schlüssel? Ein fehlender fällt
      # still auf den englischen Rückfall in `wort(k, …)` zurück -- kein
      # Fehler, keine Meldung, und in der französischen Ansicht steht plötzlich
      # ein englisches Wort. Kostet nichts und braucht keinen Browser.
      - name: Das Wörterbuch ist in allen drei Sprachen vollständig
        run: python3 .github/scripts/pruefe-woerter.py

      # Und bleibt sie auf ihrer Folie? Zwei gleichnamige Gruppen auf zwei
      # Folien sind zwei Gruppen, jede mit ihrer eigenen 1. Diese Probe fehlte,
      # als die Trennung einmal am Folienpräfix im Schlüssel hing und dieser
      # Präfix entfernt wurde -- sie prüft die Zusicherung, nicht das Mittel.
      - name: Eine cue-Gruppe bleibt auf ihrer Folie
        run: node .github/scripts/pruefe-cue-folien.js

      # Konvergiert das Deck? Typst läuft die Auszeichnung bis zu fünfmal und
      # gibt dann auf -- übersetzt aber trotzdem, mit irgendeinem
      # Zwischenstand. Diese Probe hält die Aufbauten fest, die es einmal
      # zerrissen hat: ein Schritt, der aus dem gelesenen Schrittzeiger
      # berechnet und hereingereicht wird, dazu etwas außerhalb des Flusses
      # im Körper.
      - name: Die Aufdeckketten konvergieren
        run: python3 .github/scripts/pruefe-konvergenz.py

      # Deckt `pages: "step"` das PDF Schritt für Schritt auf, und bleibt die
      # Vorgabe eine Seite je Folie? Gezählt über die PNG-Ausgabe, damit kein
      # PDF-Werkzeug auf dem Prüfrechner vorausgesetzt wird.
      - name: Das PDF kann Schritt für Schritt
        run: python3 .github/scripts/pruefe-schrittseiten.py

      # Steht auf jeder Seite, was das Handbuch verspricht? Gelesen wird der
      # Text der Seiten, nicht ihre Zahl: die Seite je Folie druckte von einer
      # gedimmten Staffelung nur den letzten Punkt, mit der richtigen
      # Seitenzahl und ohne jede Meldung.
      - name: Auf Papier steht, was versprochen ist
        run: |
          pdftotext -v >/dev/null 2>&1 || sudo apt-get install -y poppler-utils
          python3 .github/scripts/pruefe-papierregel.py

      # Zeigt das Verzeichnis seine Ebenen und die Stelle, an der der Vortrag
      # steht? Das Prüfdeck prüft sich selbst: eine Renderfunktion, die
      # abbricht, sobald ein `when` nicht stimmt.
      - name: Das Verzeichnis kennt Ebenen und Stand
        run: python3 .github/scripts/pruefe-verzeichnis.py

      # Das Kontrastgatter der Sprecherpalette. Ohne Browser und in einer
      # Sekunde: `contrast()` im Paket bewacht die Folienpaletten, die zwanzig
      # Farben der Sprecheransicht standen unter keiner Aufsicht.
      - name: Die Farben der Sprecheransicht
        run: python3 .github/scripts/pruefe-palette.py

      # Und was die Ansicht im Browser wirklich tut: nichts ragt hinaus, die
      # vier Zahlen stehen auf einer Grundlinie, die Regeln greifen, Auswahl
      # und Fokus sind zu sehen. Beides in hell und dunkel.
      - name: Die Sprecheransicht in beiden Erscheinungsbildern
        run: node .github/scripts/decklauf/pult.js

      - name: Presenter-Bedienung und automatische Aufdeckschritte
        run: node .github/scripts/pruefe-presenter-bedienung.js

      - name: YouTube im Presenter steuern
        run: node .github/scripts/pruefe-youtube.js

      - name: Audio and timer signals
        run: node .github/scripts/pruefe-audio-timer.js

      - name: GeoGebra captions and construction steps
        run: node .github/scripts/pruefe-geogebra-schritte.js

      - name: Vortragen cards with default and fallback fonts
        run: node .github/scripts/pruefe-vortragen-karten.js

      - name: Audio, video and YouTube clips
        run: node .github/scripts/pruefe-medien-ausschnitt.js

      - name: Bericht aufheben
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deckbericht
          path: bericht.json
          if-no-files-found: ignore
